<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
  {%- include head.html -%}
  <body>
    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {%- if page.url == "/" -%}
          {{ content }}
        {%- else -%}
          <div class="layout-with-sidebar">
            <aside class="sidebar">
              {%- include sidebar.html -%}
            </aside>
            <div class="main-content">
              {{ content }}
            </div>
          </div>
        {%- endif -%}
      </div>
    </main>

    {%- include footer.html -%}
  </body>
</html>
